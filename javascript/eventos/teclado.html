<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eventos</title>
    <script>
        function acao(){
            alert('Evento disparado')
        }


    </script>
</head>
<body>
    <input onkeydown="acao()" type="text" />
    <br>
    <input onkeyup ="acao()" type="text" />
    <br>
    <input onkeypress ="acao()" type="text" />
    
    
</body>
</html>
