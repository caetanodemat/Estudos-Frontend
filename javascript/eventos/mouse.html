<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eventos</title>
    <script>
        function acao(){
            alert('Evento disparado')
        }


    </script>
</head>
<body>
    <div onclick="acao()" style="background: rebeccapurple; height: 150px; width: 150px"> </div>
    <br>
    <div ondblclick="acao()" style="background: rebeccapurple; height: 150px; width: 150px"> </div>
    <br>
    <div onmouseup="acao()" style="background: rebeccapurple; height: 150px; width: 150px"> </div>
    <br>
    <div onmouseover="acao()" style="background: rebeccapurple; height: 150px; width: 150px"> </div>
    <br>
    <div onmouseout="acao()" style="background: rebeccapurple; height: 150px; width: 150px"> </div>
    
</body>
</html>
