<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <script>
        var parametro = prompt('Digite seu parametro');
        parametro = parseInt(parametro)

        switch (parametro){
            case 1:
                document.write('Parametro 1');
                break;
                Switch (parametro)
            case 2:
                document.write('Parametro 2');
                break;
                Switch (parametro)
            case 3:
                document.write('Parametro 3');
                break;
            default:
            document.write('Retorne um parametro valido');


        }
    </script>

</head>
<body>
    
</body>
</html>
