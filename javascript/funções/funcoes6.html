<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções Anônimas e Callback</title>

    <script>
        //propriedade lenght(retorna a quantidade de caracteres da string )
        var nome = ' Joao Pedro Matos '
        document.write('Joao Pedro Matos'.length)
        document.write('<br />')
        document.write('Joao Pedro Matos'.charAt(1))
        document.write('<br />')
        document.write(nome.indexOf('M'))
        document.write('<br />')
        document.write(nome.replace('Matos', 'Caetano'))
        document.write('<br />')
        document.write(nome.substr(5, 6))// 5 é a posicao inicial e 6 sao a quantidade de caracteres que seram chamados apos a posicao inicial
        document.write('<br />')
        document.write(nome.toLowerCase())
        document.write('<br />')
        document.write(nome.toUpperCase())
        document.write('<br />')
        document.write(nome.toUpperCase())
        document.write('<br />')
        document.write('-' + nome.trim() + '-')//remove os espaços do inicio e do fim
        document.write('<br />')



    </script>
</head>
<body></body>
</html>
