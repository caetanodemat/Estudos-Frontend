<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data2</title>

    <script>
        
        var data = new Date()

        //document.write((data.getDate()) + '/' + (data.getMonth() + 1) + '/' + (data.getFullYear()))// javascript reconhece o mes comecando pr 0 por isso incluimos o +1
        
        //adicionar e remover dias
        document.write(data.toString())
        data.setDate(data.getDate() + 1)
        document.write('<hr />')
        document.write(data.toString())
        data.setDate(data.getDate() - 2)
        document.write('<hr />')
        document.write(data.toString())

        //adicionar e remover meses
        document.write(data.toString())
        data.setMonth(data.getMonth() + 1)
        document.write('<hr />')
        document.write(data.toString())
        data.setMonth(data.getMonth() - 2)
        document.write('<hr />')
        document.write(data.toString())

        //adicionar e remover anos
        document.write(data.toString())
        data.setFullYear(data.getFullYear() + 1)
        document.write('<hr />')
        document.write(data.toString())
        data.setFullYear(data.getFullYear() - 2)
        document.write('<hr />')
        document.write(data.toString())
        document.write('<hr />')
        document.write('<hr />')
        document.write('<br />')
        document.write('<br />')
        document.write('<br />')
        document.write('<br />')


        //soma entre datas
        var data1 = new Date(2017, 2, 28)
        var data2 = new Date(2030, 5, 15)

        document.write(data1.toString())
        document.write('<hr />')
        document.write(data2.toString())

        //converter as datas para algo que podemos calcular
        document.write('<br />')
        document.write('<br />')
        document.write(data1.getTime())
        document.write('<hr />')
        document.write(data2.getTime())//data base para o calculo por padrao é 1 de janeiro de 1970
        document.write('<hr />')

        //encontrar a quantidade de milissegundos entre data 1 e data 2
        var milissegundos_entre_datas =Math.abs(data1.getTime() - data2.getTime())
        document.write(milissegundos_entre_datas)
        document.write('<hr />')
        document.write('1 dia tem: ' + (1*24*60*60*1000) + 'milissegundos')
        document.write('<hr />')
        document.write('A difereça de dias entre a data 1 e a data 2 é de: ' + (milissegundos_entre_datas / (1*24*60*60*1000)) + ' dias')








    </script>
</head>
<body></body>
</html>
