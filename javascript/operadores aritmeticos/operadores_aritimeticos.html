<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <script>
        
            var num1 = prompt('Digite o primeiro numero')
            var num2 = prompt ('Digite o segundo numero')
            num1 = parseInt(num1)
            num2 = parseInt(num2)


            document.write('A soma entre '+ num1 +' e ' + num2 + ' é:' + (num1+num2) + '<br />')
            
            document.write('A subtraçao entre '+ num1 +' e ' + num2 + ' é:' + (num1-num2) + '<br />')
            document.write('A multiplicao entre '+ num1 +' e ' + num2 + ' é:' + (num1*num2) + '<br />')
            document.write('A divisao entre '+ num1 +' e ' + num2 + ' é:' + (num1/num2) + '<br />')
            document.write('O resto entre '+ num1 +' e ' + num2 + ' é:' + (num1%num2) + '<br />')
            document.write('O incremeto de  '+ num1 +'  é:' + (++num1) + '<br />')
            document.write('O incremeto de  '+ num2 +'  é:' + (++num2) + '<br />')
            document.write('O incremeto de  '+ num2 +'  é:' + (num2++) + '<br />')//o acrescimo é feito apos a inscricao da variavel
            document.write(num2 + '<br />')
            document.write('O decremento de  '+ num2 +'  é:' + (num2--) + '<br />')
            document.write(num2 + '<br />')
