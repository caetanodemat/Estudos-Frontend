<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <script>
        function modificaEstilo(corDeFundo, l, a){
            document.getElementById('quadrado').style.background = corDeFundo
            document.getElementById('quadrado').style.width = l
            document.getElementById('quadrado').style.height = a

        }
    </script>
        
    
</head>
<body>
    <h3>Manipulando estilo</h3>
    <button type="button" onclick="modificaEstilo('#FF0000', '300px', '400px')">Vermelho</button>
    <button type="button" onclick="modificaEstilo('#00FF00', '350px', '300px')">Verde</button>
    <button type="button" onclick="modificaEstilo('#0000FF', '3000px', '5500px')">Azul</button>
    
    <hr />
    <div style="border: solid 1px #000; width:100px; height: 100px" id="quadrado"></div>
    
</body>
</html>
