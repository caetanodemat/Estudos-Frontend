<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        .estilo1 {
            background: red;
            color: white;


        }
        .estilo2{
            width: 400px;
            height: 50px;
            background: green;
            text-align: center;
            font-size: 25px;
            color: black;
            padding: 25px;
        }
        
    </style>
    <script>
        function modificaClasse(){
            document.getElementById('mensagem').className = 'estilo2'
        }
    </script>
    
</head>
<body>

    <div id="mensagem" class="estilo1">Modificando a classe do elemento</div>
    <hr />
    <button type="button" onclick="modificaClasse()">Aplicar classe</button>
    
</body>
</html>
