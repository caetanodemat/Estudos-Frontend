        var lista_numeros = Array()
        lista_numeros[0] = 12
        lista_numeros[1] = 22
        lista_numeros[2] = 3
        lista_numeros[3] = 5
      

        function ordenacao(a, b){
            return a - b
        }
        console.log(lista_numeros.sort(ordenacao))
