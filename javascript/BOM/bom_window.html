<!html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Criamos uma variável global para armazenar a referência da janela
        let minhaJanela;

        function abrirPopUp(){
            // Armazena a janela aberta na variável e usa um tamanho maior
            minhaJanela = window.open('https://www.google.com', 'nova_janela', 'width=600,height=500');
        }

        function fecharPopUp(){
            // Verifica se a janela existe e a fecha
            if(minhaJanela) {
                minhaJanela.close();
            }
        }
    </script>
</head>
<body>

    <button onclick="abrirPopUp()">Abrir Janela</button>
    <button onclick="fecharPopUp()">Fechar Janela</button>
    <button onclick="window.print()">Imprimir pagina</button>


</body>
</html>
